server {
    listen 80;
    server_name _;

    root /app/public;
    index index.html index.php;

    charset utf-8;

    # Static assets (index.html, app.js, style.css) are served straight from
    # disk; everything else falls through to the front controller.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Benchmarks can ask for large result sets; don't cut them off.
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 256M;

    # localhost is shared with every other project on the machine, so the
    # browser can easily carry more cookies for it than the 8k default header
    # buffer holds -- which shows up as a bare "400 Request Header Or Cookie
    # Too Large" before the request ever reaches PHP.
    large_client_header_buffers 8 64k;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
