; The importer streams the CSV, but the street/municipality map it aggregates
; is held in memory for the whole run.
memory_limit = 1G

; CLI imports of 4.2M rows run for minutes; no wall clock on them.
max_execution_time = 0

; It's a POC: errors should be loud, on the page and in the log.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Bulk multi-row inserts and large ES bulk bodies.
post_max_size = 256M
upload_max_filesize = 256M

date.timezone = Europe/Brussels
