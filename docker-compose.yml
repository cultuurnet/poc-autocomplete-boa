services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      # The whole project root, so the 620 MB source CSV is readable at
      # /app/<name>.csv without copying it into the image.
      - ./:/app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: autocomplete
      MYSQL_USER: autocomplete
      MYSQL_PASSWORD: autocomplete
      MYSQL_TABLE: location_suggestions
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: location_suggestions
      # Set to 1 when the index was built with --level=address or --level=all,
      # so a typed house number narrows the search instead of only ranking it.
      HOUSE_NUMBERS_INDEXED: "${HOUSE_NUMBERS_INDEXED:-0}"
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      # 3306 is usually taken by a local MySQL, so forward to 3307 on the host.
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autocomplete
      MYSQL_USER: autocomplete
      MYSQL_PASSWORD: autocomplete
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/poc.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.12
    environment:
      discovery.type: single-node
      # POC only: no TLS, no auth, so the PHP client can talk plain HTTP.
      # Never do this outside a throwaway local stack.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  mysql-data:
  elasticsearch-data:
